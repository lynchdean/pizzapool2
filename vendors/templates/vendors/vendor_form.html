{% extends "base.html" %}

{% block content %}
<h1>{% if vendor %}Edit vendor{% else %}Add vendor{% endif %}</h1>

<article>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save</button>
  </form>
  {% if vendor %}
    <a href="{% url 'organisations:vendor_detail' organisation.slug vendor.id %}">Cancel</a>
  {% else %}
    <a href="{% url 'organisations:organisation_detail' organisation.slug %}">Cancel</a>
  {% endif %}
</article>

{% if vendor %}
<article>
  <form method="post" action="{% url 'organisations:vendor_delete' organisation.slug vendor.id %}"
        onsubmit="return confirm('Delete this vendor?');">
    {% csrf_token %}
    <button type="submit" class="secondary outline">Delete vendor</button>
  </form>
</article>
{% endif %}
{% endblock %}
