{% extends "base.html" %}

{% block content %}
<h1>{% if vendor %}Edit vendor{% else %}Add vendor{% endif %}</h1>

<article>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save</button>
  </form>
  {% if vendor %}
    <a href="{% url 'organisations:vendor_detail' organisation.slug vendor.id %}" class="icon-text">
  {% else %}
    <a href="{% url 'organisations:organisation_detail' organisation.slug %}" class="icon-text">
  {% endif %}
    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="19" y1="12" x2="5" y2="12"></line>
      <polyline points="12 19 5 12 12 5"></polyline>
    </svg>
    Cancel
  </a>
</article>

{% if vendor %}
<article>
  <form method="post" action="{% url 'organisations:vendor_delete' organisation.slug vendor.id %}"
        onsubmit="return confirm('Delete this vendor?');">
    {% csrf_token %}
    <button type="submit" class="secondary outline">Delete vendor</button>
  </form>
</article>
{% endif %}
{% endblock %}
