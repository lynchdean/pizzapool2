{% extends "base.html" %}

{% block content %}
<h1>Set a new password</h1>
<article>
  {% if validlink %}
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Set password</button>
    </form>
  {% else %}
    <p>This password reset link is invalid or has already been used.</p>
    <a href="{% url 'password_reset' %}">Request a new link</a>
  {% endif %}
</article>
{% endblock %}
