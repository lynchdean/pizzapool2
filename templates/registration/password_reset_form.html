{% extends "base.html" %}

{% block content %}
<h1>Reset your password</h1>
<article>
  <p>Enter your account's email address and we'll send you a link to reset your password.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Send reset link</button>
  </form>
</article>
{% endblock %}
