{% extends "base.html" %}

{% block content %}
<h1>Edit organisation</h1>

<article>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save</button>
  </form>
  <a href="{% url 'organisations:organisation_detail' organisation.slug %}">Cancel</a>
</article>
{% endblock %}
