name: CI

"on":
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pizzapool_test
          POSTGRES_USER: pizzapool
          POSTGRES_PASSWORD: pizzapool
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: qisBdMktO_maLTUedQPnWaaXwnMd9b9MetDch8wUqxCQfE5rG8D9MJSNvBEEUAAvRjg
      DEBUG: "False"
      ALLOWED_HOSTS: "testserver"
      DB_NAME: pizzapool_test
      DB_USER: pizzapool
      DB_PASSWORD: pizzapool
      DB_HOST: localhost
      DB_PORT: 5432

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py check --deploy --fail-level WARNING
      - run: python manage.py collectstatic --noinput
      - run: python manage.py test
